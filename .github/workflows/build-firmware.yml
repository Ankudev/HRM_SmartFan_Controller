name: Build SmartFan Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core 3.3.5 and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli lib install "NimBLE-Arduino@2.3.7" "LovyanGFX@1.2.19"

      - name: Compile SmartFan Firmware
        run: |
          mkdir -p build_out
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=default_8MB \
            --output-dir build_out \
            firmware/SmartFan
          cp build_out/SmartFan.ino.bin build_out/SmartFan_OTA.bin
          cp build_out/SmartFan.ino.merged.bin build_out/SmartFan_FullFlash_0x0.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartFan-Firmware-Binaries
          path: |
            build_out/SmartFan_OTA.bin
            build_out/SmartFan_FullFlash_0x0.bin

      - name: Attach Binaries to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_out/SmartFan_OTA.bin
            build_out/SmartFan_FullFlash_0x0.bin
